<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Not Found</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      width: 100%;
      background-color: #f5f5f5;
      color: #111111;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      text-align: center;
      user-select: none;
    }
    h1 {
      font-size: clamp(6rem, 18vw, 9.5rem);
      font-weight: 900;
      line-height: 1;
      letter-spacing: -0.05em;
      color: #0a0a0a;
    }
    h2 {
      margin-top: 0.5rem;
      font-size: clamp(1.25rem, 4vw, 1.875rem);
      font-weight: 700;
      color: #666666;
    }
    p.lead {
      margin-top: 0.5rem;
      font-size: clamp(1rem, 2.5vw, 1.25rem);
      font-weight: 500;
      color: #b8b8b8;
    }
    p.sub {
      margin-top: 0.25rem;
      font-size: clamp(0.75rem, 2vw, 0.875rem);
      font-weight: 500;
      color: #777777;
    }
    .btn {
      margin-top: 2rem;
      display: inline-block;
      padding: 0.75rem 1.75rem;
      background-color: #141414;
      color: #ffffff;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      text-decoration: none;
      border: none;
      border-radius: 0.25rem;
      cursor: pointer;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
      transition: background 0.2s, transform 0.1s;
    }
    .btn:hover { background-color: #2b2b2b; }
    .btn:active { transform: scale(0.99); }
  </style>
</head>
<body>
  <h1>404</h1>
  <h2>Oops, This Page Not Found!</h2>
  <p class="lead">The internet connection might be disconnected.</p>
  <p class="sub">or the network may have been turned off in the system</p>
  <button class="btn" onclick="window.location.reload()">RETRY CONNECTION</button>
  <script>
    window.addEventListener('online', function() {
      window.location.reload();
    });
  </script>
</body>
</html>
